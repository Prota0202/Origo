# ORIGO — stack production (front + API + Postgres + backups + HTTPS)
#
# Usage :
#   cp .env.prod.example .env.prod   (puis remplir)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Différences avec docker-compose.yml (dev) :
#   - Postgres n'expose aucun port sur l'hôte (accessible seulement par l'API)
#   - mot de passe Postgres obligatoire, pas de valeur par défaut
#   - uploads dans un volume nommé (les photos survivent aux rebuilds)
#   - Caddy termine le TLS et sert le front
#   - dumps Postgres quotidiens avec rétention

name: origo-prod

services:
  db:
    image: postgres:16-alpine
    container_name: origo-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
    volumes:
      - origo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: origo-prod-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public&connection_limit=20
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant (≥ 32 caractères)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-16h}
      PORT: '3001'
      HOST: '0.0.0.0'
      # Caddy est le seul proxy devant l'API : 1 saut
      TRUST_PROXY: '1'
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN manquant (https://ton-domaine)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Crée / réinitialise le compte direction au démarrage (upsert, non destructif)
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-0}
      ADMIN_CODE: ${ADMIN_CODE:-ORIGO}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      UPLOADS_URL_TTL_S: ${UPLOADS_URL_TTL_S:-21600}
      # Odoo : vide tant que l'intégration n'est pas en place, ORIGO tourne seul.
      # Renseigné, l'API vérifie la liaison au démarrage puis toutes les 15 min.
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USER: ${ODOO_USER:-}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      COMPANY_NAME: ${COMPANY_NAME:-ORIGO}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-Avenue des Anciens Combattants 23, 1140 Evere}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-mehdi@origobrussels.be}
      COMPANY_PHONE: ${COMPANY_PHONE:-+32 468 08 96 03}
      COMPANY_VAT: ${COMPANY_VAT:-}
      TVA_RATE: ${TVA_RATE:-0.21}
      DELAI_MODIFICATION_MS: ${DELAI_MODIFICATION_MS:-3600000}
      BACKUP_STATUS_DIR: /backups
      PUBLIC_URL: ${PUBLIC_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    volumes:
      - origo_uploads:/app/uploads
      - ./backups:/backups:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/v1/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: origo-prod-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Domaine complet (ex. commande.origo.be) → HTTPS automatique.
      # Mettre :80 pour un test local sans certificat.
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS manquant (ton domaine, ou :80 en test local)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    container_name: origo-prod-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_UPLOADS_DIR: /uploads
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
    volumes:
      - ./scripts/pg-backup-loop.sh:/pg-backup-loop.sh:ro
      - ./backups:/backups
      - origo_uploads:/uploads:ro
    entrypoint: ['/bin/sh', '/pg-backup-loop.sh']

volumes:
  origo_pg:
  origo_uploads:
  caddy_data:
  caddy_config:
