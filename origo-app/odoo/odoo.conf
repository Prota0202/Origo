[options]
; Configuration Odoo pour l'auto-hébergement derrière Caddy.
; Les paramètres de base de données ne sont PAS ici : l'entrypoint de l'image
; les injecte depuis HOST / USER / PASSWORD (voir docker-compose.odoo.yml).

; Enterprise AVANT Community : les modules présents dans les deux dépôts doivent
; être chargés dans leur version Enterprise. Dossier vide = fonctionne en Community.
addons_path = /mnt/enterprise-addons,/usr/lib/python3/dist-packages/odoo/addons

; Derrière un reverse proxy : sans ceci Odoo fabrique des URL en http et
; certaines redirections cassent en HTTPS.
proxy_mode = True

; Le gestionnaire de bases (/web/database/manager) permet de créer, dupliquer et
; SUPPRIMER des bases. Exposé sur Internet, c'est une porte ouverte sur la
; comptabilité. On le désactive : la création initiale se fait en ligne de
; commande (voir DEPLOY.md).
list_db = False

; Filtre de base : même si list_db était réactivé par erreur, une seule base
; est joignable. %d = nom d'hôte demandé ; on épingle plutôt en dur via -d.
; dbfilter = ^origo$

; workers > 0 est nécessaire pour que le port gevent (8072) écoute, sinon les
; websockets d'Odoo ne répondent pas et l'interface se recharge en boucle.
workers = 3
gevent_port = 8072

; Garde-fous mémoire par worker : un rapport trop lourd tue le worker plutôt que
; la machine. Le worker est relancé automatiquement.
limit_memory_soft = 1073741824
limit_memory_hard = 1342177280
limit_time_cpu = 300
limit_time_real = 600

; Un cron suffit largement à ce volume, et il ne doit pas concurrencer les
; workers HTTP pour la mémoire.
max_cron_threads = 1
